version: '0.2'
# Game-aware cspell config distributed to scaffolded projects (#286).
# Scaffolded projects import this via `@joshuafolkken/game-kit/cspell/game`, so the
# game-template words and the credits ignore flow automatically on a dependency bump —
# no template re-sync. game-kit's own root cspell.config.yaml imports it too, so the
# game-common word set is single-sourced here and cannot drift between repo and scaffold.
import:
  - '@joshuafolkken/app-kit/cspell/sveltekit'
words:
  - COEFF
  - gameover
  - jgame
  # three.js mesh-compression codec (the EXT_meshopt_compression glTF extension); its decoder is
  # the reason script-src carries 'wasm-unsafe-eval' in svelte.config.js.
  - meshopt
  # SvelteKit verb form; the dictionary app-kit ships already carries `prerendered`. Used by the
  # `josh-game sync` guard that warns when a prerendered route meets %sveltekit.nonce%.
  - prerenders
  - Orbitron
  - SAMEORIGIN
  - threlte
  - trycloudflare
  - viewbox
ignorePaths:
  - '**/game/credits.ts'
